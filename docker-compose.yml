version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: reiner_datalake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=reineradmin
      - MINIO_ROOT_PASSWORD=reiner12345
    command: server /data --console-address ":9001"
    volumes:
      - ./datalake_data:/data

  ai-backend:
    build: .
    container_name: enterprise_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=reineradmin
      - MINIO_SECRET_KEY=reiner12345
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000
    depends_on:
      - minio

  ai-chat-ui:
    build: .
    container_name: enterprise_ai_chat_ui
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - BACKEND_URL=http://ai-backend:8000
    command: streamlit run src/ui/chat_app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - ai-backend