version: '3.8'

services:
  ai-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: enterprise_ai_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./:/app
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --reload

  ai-chat-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: enterprise_ai_chat_ui
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://ai-backend:8000
    volumes:
      - ./:/app
    depends_on:
      - ai-backend
    command: streamlit run src/ui/chat_app.py --server.port=8501 --server.address=0.0.0.0
